name: Daily rescan

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC every day
  workflow_dispatch:
    inputs:
      lookback:
        description: "Days to look back"
        default: "7"

permissions:
  contents: write

concurrency:
  group: rescan
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan OpenRouter + Hugging Face for new releases
        id: scan
        run: node scripts/rescan.mjs --lookback=${{ inputs.lookback || '7' }}

      - name: Commit new releases
        if: steps.scan.outputs.added != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: daily rescan, ${{ steps.scan.outputs.added }} new release(s)"
          git push
